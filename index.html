<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050f20" />
    <!-- Zinapoya has its own language switch; browser auto-translate would also translate the English practice. -->
    <meta name="google" content="notranslate" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/v2/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zinapoya" />
    <title>Zinapoya — Step up to your level</title>
    <meta name="description" content="Zinapoya is a learning platform for languages, exam prep (IELTS, TOEFL, CEFR Multilevel, SAT) and school subjects — step by step, with an AI coach." />
    <!-- Link preview card in Telegram, WhatsApp… (makes the link easy to tap on iPhone too). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zinapoya" />
    <meta property="og:title" content="Zinapoya — Step up to your level" />
    <meta property="og:description" content="Languages, IELTS, SAT, CEFR and school subjects — learn step by step with an AI coach." />
    <meta property="og:url" content="https://zinapoya.vercel.app/" />
    <!-- New file name whenever the picture changes: apps (Telegram…) remember previews by address. -->
    <meta property="og:image" content="https://zinapoya.vercel.app/icons/v2/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://zinapoya.vercel.app/icons/v2/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Zinapoya — Step up to your level" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://zinapoya.vercel.app/icons/v2/og-image.jpg" />
    <link rel="canonical" href="https://zinapoya.vercel.app/" />
    <link rel="icon" href="/icons/v2/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/v2/favicon-32.png" sizes="32x32" type="image/png" />
    <script>
      // Set the theme before the page paints, so dark mode never flashes white.
      try {
        var c = localStorage.getItem('su_theme') || 'auto';
        var dark = c === 'dark' || (c === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@800&family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
