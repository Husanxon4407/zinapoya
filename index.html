<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <!-- SpeakUp has its own language switch; browser auto-translate would also translate the English practice. -->
    <meta name="google" content="notranslate" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SpeakUp" />
    <title>SpeakUp — Multilevel Speaking Practice</title>
    <meta name="description" content="Practise the Multilevel (CEFR) English speaking exam: real exam questions, timers, recordings, AI feedback and games." />
    <!-- Link preview card in Telegram, WhatsApp… (makes the link easy to tap on iPhone too). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SpeakUp" />
    <meta property="og:title" content="SpeakUp — Multilevel Speaking Practice" />
    <meta property="og:description" content="Practise the Multilevel speaking exam: real questions, timers, recordings, AI feedback and games." />
    <meta property="og:url" content="https://speakup-multilevel.vercel.app/" />
    <meta property="og:image" content="https://speakup-multilevel.vercel.app/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://speakup-multilevel.vercel.app/" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>" />
    <script>
      // Set the theme before the page paints, so dark mode never flashes white.
      try {
        var c = localStorage.getItem('su_theme') || 'auto';
        var dark = c === 'dark' || (c === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
